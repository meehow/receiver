name: receiver
base: core24
version: '0.8.0'
title: Receiver
summary: Discover radio stations worldwide
description: |
  Most radio apps make you search for stations by name or paste in a stream
  URL. Receiver ships with over 30,000 stations ready to explore — each one
  individually scanned and verified, with duplicates removed and logos
  fetched in proper resolution. Just open the app and start discovering.

  No sign-up. No ads. No popularity rankings deciding what you hear.
  Just radio.
license: GPL-3.0-or-later
contact: https://github.com/meehow/receiver/issues
issues: https://github.com/meehow/receiver/issues
source-code: https://github.com/meehow/receiver
website: https://github.com/meehow/receiver

grade: stable
confinement: strict
icon: data/icons/hicolor/512x512/apps/io.github.meehow.Receiver.png

platforms:
  amd64:
  arm64:
  armhf:
  riscv64:

slots:
  receiver-mpris:
    interface: mpris

apps:
  receiver:
    command: usr/bin/receiver
    desktop: usr/share/applications/io.github.meehow.Receiver.desktop
    extensions: [gnome]
    environment:
      GIO_USE_PROXY_RESOLVER: gnome
      LOCALEDIR: $SNAP/usr/share/locale
    plugs:
      - network
      - audio-playback
      - desktop
    slots:
      - receiver-mpris
  receiver-tui:
    command: usr/bin/receiver-tui
    extensions: [gnome]
    environment:
      GIO_USE_PROXY_RESOLVER: gnome
      LOCALEDIR: $SNAP/usr/share/locale
    plugs:
      - network
      - audio-playback
    slots:
      - receiver-mpris

layout:
  /usr/share/receiver:
    bind: $SNAP/usr/share/receiver

parts:
  receiver:
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    build-packages:
      - valac
      - libgtk-4-dev
      - libadwaita-1-dev
      - libgstreamer1.0-dev
      - libsoup-3.0-dev
      - libjson-glib-dev
      - libsqlite3-dev
      - libncurses-dev
      - gettext
    stage-packages:
      - libncursesw6

  # gnome-46-2404 provides every GStreamer plugin we need except an AAC
  # decoder. Stage only faad rather than all of plugins-bad, which drags in
  # ~55 MB of video encoders and ~26 MB of speech-synthesis voices.
  gst-aac:
    plugin: nil
    stage-packages:
      - gstreamer1.0-plugins-bad
    stage:
      - usr/lib/*/gstreamer-1.0/libgstfaad.so
      - usr/lib/*/libfaad.so*
